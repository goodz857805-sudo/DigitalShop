<!doctype html>
<html lang="zh-CN" data-scene="store" data-mode="self">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="数字化门店 · 页面模板：首页入口、核心指标达成与财务开单报表。" />
<meta name="theme-color" content="#E8F7FB" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2300AAA6'/%3E%3Cpath d='M8 23V16h4v7H8Zm6 0V11h4v12h-4Zm6 0V7h4v16h-4Z' fill='%23fff'/%3E%3C/svg%3E" />
<title>页面模板 · 数字化门店</title>
<link rel="stylesheet" href="../digital-store-tokens.css" />
<!--
  模板：数字化门店 / 服务指南针 · 多页报表骨架
  --------------------------------------------------------------------------
  1. 页面：首页（入口页）+ 核心指标达成 + 财务开单。导航 / 页签 / 首页入口由 MENU 渲染，
     不要手写重复 DOM；换系统时整段替换 MENU 与页面数据。
  2. 系统名称：data-scene="store" 显示「数字化门店」，"compass" 显示「服务指南针」；
     其他系统必须补 data-brand="系统名称"，缺省显示「未命名系统」并在控制台提示。
  3. 页签行为：首页固定，报表页签可收藏 / 关闭；切走再切回会恢复该页上次的筛选与视图。
  4. data-scene 控制 8 / 12 节奏（store = 8，其余 = 12），data-mode 控制自开发 / QBI。
  5. 样式：tokens 来自 ../digital-store-tokens.css，组件外观内联在本页，便于整页复制；
     需要零散区块时用 components.css + blocks.md。
  6. 页面宽度流式，内容区在 100dvh 内滚动；≤1024 侧导航转抽屉，Esc 关闭。
  7. 图标 sprite 在 body 顶部，复制页面时整段带走；缺图标去 references/icons/ 找。
-->
<style>
html{--page-gap:12px}
html[data-scene="store"]{--page-gap:8px}
:root{--sidenav-bg:#f4fbfd;--gradient-ai-title:linear-gradient(90deg,#8264ff 0%,#24d0ca 100%);--gradient-ai-button:linear-gradient(148deg,#976fff 21%,#6eb1f3 100%)}

/* ==========================================================================
   Base
   ========================================================================== */
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;min-width:320px;font-family:var(--font-family-cn-stack);font-size:var(--font-size-14);line-height:var(--line-height-22);color:var(--text-color-text-1);background:var(--higreen-bg-page-02)}
[hidden]{display:none!important}
button{font-family:inherit}
a{color:var(--primary-primary-8)}
img,svg{display:block}
::selection{background:var(--primary-primary-2);color:var(--text-color-text-1)}
:focus-visible{outline:2px solid var(--primary-primary-7);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:fixed;left:16px;top:-56px;z-index:var(--z-toast);height:40px;padding:0 16px;display:flex;align-items:center;background:var(--text-color-text-1);color:#fff;border-radius:4px;text-decoration:none;transition:top .18s}
.skip:focus{top:12px}
.icon{fill:currentColor;display:block;flex:none}

/* ==========================================================================
   报表组件（数字化门店组件库外观）
   ========================================================================== */
.ind{position:relative;flex:none;width:232px;height:108px;border-radius:var(--radius-lg);overflow:hidden}
.ind-in{height:100%;border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--indicatorcard-default);transition:background-color .16s ease}
.ind-h{display:flex;align-items:center;justify-content:flex-start;gap:8px}
.ind-t{font-size:14px;line-height:22px;font-weight:600;color:var(--text-color-text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ind-ti{display:flex;align-items:center;gap:4px;flex:none;color:var(--text-color-text-2)}
.ind-ti .icon{width:14px;height:14px}
.ind-c{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:1;min-height:0}
.ind-total{display:flex;align-items:baseline;gap:4px;padding:9px 0;min-width:0}
.ind-num{font-family:var(--font-family-num-stack);font-variant-numeric:tabular-nums;font-size:36px;line-height:36px;font-weight:600;color:var(--text-color-text-1);white-space:nowrap}
.ind-un{font-size:14px;line-height:22px;font-weight:600;color:var(--text-color-text-1);white-space:nowrap}
.ind-d{display:flex;flex-direction:column;width:99.8px;flex:none}
.ind-db{display:flex;align-items:center;justify-content:space-between;width:99.8px}
.ind-dk{font-size:14px;line-height:18px;font-weight:400;color:var(--text-color-text-3)}
.ind-dv{display:flex;align-items:center}
.ind-v2{font-family:var(--font-family-num-stack);font-variant-numeric:tabular-nums;font-size:14px;line-height:18px;font-weight:600;color:var(--text-color-text-1)}
.ind-trend{width:12px;height:12px;flex:none;fill:currentColor}
.ind-trend.up{color:var(--semantic-semantic-performwell)}
.ind-trend.down{color:var(--semantic-semantic-performbad)}

.sn{position:relative;width:var(--layout-sidebar-width);background:var(--sidenav-bg);border-radius:8px;overflow:hidden;font-size:14px;line-height:22px}
.sn-logo{display:flex;align-items:center;gap:6px;padding:14px 0 10px 9px}
.sn-logo svg{width:74px;height:12px;flex:none}
.sn-logo b{min-width:0;overflow:hidden;font-size:16px;line-height:24px;font-weight:600;color:var(--text-color-text-1);white-space:nowrap;text-overflow:ellipsis}
.sn-menu{display:flex;flex-direction:column;margin:0 12px}
.sn-item{position:relative;display:flex;align-items:center;gap:8px;width:100%;padding:8px 20px;border:0;background:none;color:var(--text-color-text-2);cursor:pointer;user-select:none;text-align:left;font-size:14px;line-height:22px}
.sn-item .icon{width:16px;height:16px;flex:none}
.sn-item-txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sn-arrow{width:14px;height:14px;flex:none;fill:currentColor;color:var(--primary-primary-6);transition:transform .15s}
.sn-item.is-open .sn-arrow{transform:rotate(180deg)}
.sn-l1{font-weight:600;color:var(--text-color-text-1);padding-left:20px}
.sn-l2{padding:10px 20px 10px 40px;font-weight:400}
.sn-sub{display:flex;flex-direction:column}
.sn-sub.is-fold{display:none}
.sn-item.is-on{color:var(--primary-primary-6);font-weight:600}
.sn-item.is-on::before{content:"";position:absolute;left:0;right:0;top:0;bottom:0;border-radius:8px;z-index:0;background:var(--higreen-higreen-pageheader-bg);border-right:3px solid var(--chart-chart-1)}
.sn-item > *{position:relative;z-index:1}
.sn-item.is-on .icon{color:var(--primary-primary-6)}
.sn-item:hover:not(.is-on){background:rgba(255,255,255,.5)}
.sn-fold{position:absolute;right:10px;bottom:9px;width:20px;height:20px;padding:0;border:0;background:none;color:var(--text-color-text-2);cursor:pointer}
.sn-fold .icon{width:20px;height:20px}

.page-tabs{display:flex;align-items:flex-end;gap:0;border-bottom:1px solid var(--line-color-border-2)}
.ptab{position:relative;flex:none;height:32px;padding:0 20px;border-radius:4px 4px 0 0;border:1px solid var(--line-color-border-2);border-bottom:0;background:var(--higreen-higreen-pageheader-bg2);color:var(--text-color-text-2);font-size:14px;line-height:22px;display:flex;align-items:center;gap:10px;margin-bottom:-1px;cursor:pointer;user-select:none}
/* 页签相邻无间隙，左侧描边与前一格右侧描边重叠 1px 合成单线 */
.ptab + .ptab{margin-left:-1px}
.ptab.is-active{background:var(--higreen-higreen-pageheader-bg);border-color:var(--primary-primary-6);color:var(--primary-primary-6);z-index:1}
.ptab .icon{width:14px;height:14px;flex:none}
.ptab.has-star{gap:4px}
.ptab-tx{white-space:nowrap}
.ptab-fav,.ptab-x{display:inline-flex;align-items:center;justify-content:center;flex:none;padding:0;border:0;border-radius:2px;background:none;color:inherit;cursor:pointer;transition:color .12s ease}
.ptab-fav{width:14px;height:14px}
.ptab-fav .icon{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:4}
.ptab.is-fav .ptab-fav .icon{fill:#F7BA1E;stroke:none}
.ptab-x{width:10px;height:10px}
.ptab-x .icon{width:10px;height:10px}
.ptab-fav:hover,.ptab-x:hover{color:var(--primary-primary-8)}
.ptab-fav:focus-visible,.ptab-x:focus-visible{outline:2px solid var(--primary-primary-6);outline-offset:1px}
.ptab:hover:not(.is-active){background:var(--gray-gray-2)}
.ptab:focus-visible{outline:2px solid var(--primary-primary-6);outline-offset:-2px}

.filterbar{display:flex;align-items:center;justify-content:space-between;gap:8px;height:var(--filterbar-height);padding:var(--filterbar-padding);background:var(--color-white);border-radius:var(--filterbar-radius);position:relative;z-index:4}
.fb-left{display:flex;align-items:center;gap:var(--filterbar-gap);min-width:0}
.fb-right{display:flex;align-items:center;gap:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--button-gap);height:var(--button-height);padding:var(--button-padding-y) var(--button-padding-x);border:1px solid transparent;border-radius:var(--button-radius);background:transparent;font-family:inherit;font-size:14px;line-height:22px;color:var(--text-color-text-1);cursor:pointer;white-space:nowrap;transition:background-color .12s ease,border-color .12s ease,color .12s ease}
.btn .icon{width:14px;height:14px}
.btn-secondary{background:var(--button-secondary-bg);border-color:var(--button-secondary-border);color:var(--button-secondary-text)}
.btn-secondary:hover{background:var(--button-secondary-bg-hover);border-color:var(--button-secondary-border-hover);color:var(--button-secondary-text-hover)}
.btn-secondary:active{background:var(--button-secondary-bg-active);border-color:var(--button-secondary-border-hover);color:var(--button-secondary-text-hover)}
.u-dsel{display:inline-flex;align-items:center;gap:8px;flex:none}
.u-dsel .dd-wrap{position:relative;display:block}
.u-tabs-round{display:inline-flex;align-items:center;padding:3px;background:var(--gray-gray-2);border-radius:var(--radius-sm);flex:none}
.u-tabs-round span{display:inline-flex;align-items:center;justify-content:center;padding:2px 12px;border-radius:var(--radius-sm);font-size:14px;line-height:22px;color:var(--text-color-text-2);cursor:pointer;transition:background-color .12s ease,color .12s ease;user-select:none}
.u-tabs-round span:hover{color:var(--text-color-text-1)}
.u-tabs-round span.is-on{background:var(--color-white);color:var(--primary-primary-6)}
.u-tabs-round .u-div{width:1px;height:14px;flex:none;background:var(--gray-gray-3)}
.u-dsel-tr{display:flex;align-items:center;gap:10px;width:260px;height:32px;padding:4px 12px;border-radius:var(--radius-sm);border:1px solid var(--text-color-text-4);background:var(--color-white);font-family:inherit;font-size:14px;line-height:22px;color:var(--text-color-text-1);cursor:pointer;transition:border-color .12s ease}
.u-dsel-tr:hover{border-color:var(--primary-primary-5)}
.dd-wrap.is-open .u-dsel-tr{border-color:var(--primary-primary-6)}
.u-dsel-ic{width:16px;height:16px;flex:none;display:flex;align-items:center;color:var(--text-color-text-2)}
.u-dsel-ic .icon{width:16px;height:16px}
.u-dsel-tx{display:flex;align-items:center;justify-content:center;gap:8px;flex:1;min-width:0;white-space:nowrap;overflow:hidden}
.u-dsel-tx > span{font-variant-numeric:tabular-nums}
.u-dsel-sep{width:28px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--text-color-text-3)}
.u-dsel-sep .icon{width:12px;height:12px}

.dd-wrap{position:relative}
.select{display:inline-flex;align-items:center;justify-content:space-between;gap:4px;width:var(--w,auto);height:32px;padding:var(--select-padding);border-radius:var(--select-radius);border:1px solid var(--select-border);background:var(--color-white);font-family:inherit;font-size:14px;line-height:22px;color:var(--text-color-text-1);cursor:pointer;white-space:nowrap;transition:border-color .12s ease}
.select:hover{border-color:var(--primary-primary-5)}
.dd-wrap.is-open .select{border-color:var(--select-border-active)}
.sel-txt{min-width:0;overflow:hidden;text-overflow:ellipsis}
.select-caret{width:12px;height:12px;flex:none;display:block;color:var(--text-color-text-3);transition:transform .15s ease}
.dd-wrap.is-open .select-caret{transform:rotate(180deg)}
.dropdown{position:absolute;top:36px;left:0;min-width:100%;width:max-content;max-width:280px;z-index:var(--z-dropdown);background:var(--color-white);border-radius:var(--dropdown-radius);box-shadow:var(--dropdown-shadow);border:1px solid var(--gray-gray-2);display:none;overflow:hidden}
.dd-wrap.is-open .dropdown{display:block;animation:dd-in .12s ease}
@keyframes dd-in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.dropdown-inner{padding:4px 0;max-height:var(--dropdown-max-height);overflow:auto;scrollbar-width:8px}
.dd-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:var(--dropdown-item-padding);font-size:14px;line-height:22px;color:var(--text-color-text-2);cursor:pointer;white-space:nowrap}
.dd-item:hover{background:var(--gray-gray-2)}
.dd-item.is-active{color:var(--primary-primary-6);font-weight:600}
.dd-check{width:12px;height:12px;flex:none;display:block;visibility:hidden}
.dd-item.is-active .dd-check{visibility:visible}
/* 区间日期下拉（Figma 1608:26558 基本+范围+预设范围）：快捷列 126 + 双月 280×2 */
.dp-panel{display:none;align-items:stretch;width:max-content;max-width:none;padding:0;border-color:var(--line-color-border-2);box-shadow:var(--dropdown-shadow)}
.dd-wrap.is-open .dp-panel{display:flex}
/* 触发器右侧空间不足时右对齐；两侧都放不下时改为视口内固定居中，面板内部横向滚动 */
.dd-wrap.is-flip .dp-panel{left:auto;right:0}
.dp-panel.is-fixed{position:fixed;left:0;top:0;min-width:0;max-width:calc(100vw - 16px);max-height:calc(100dvh - 24px);overflow:auto}
.dp-sc{flex:none;width:126px;padding:12px 8px;display:flex;flex-direction:column;gap:10px;border-right:1px solid var(--line-color-border-2)}
.dp-sc-item{width:100%;padding:2px 12px;border:1px solid var(--text-color-text-4);border-radius:var(--radius-sm);background:var(--gray-gray-1);font-family:inherit;font-size:12px;line-height:18px;text-align:left;color:var(--text-color-text-2);cursor:pointer;user-select:none}
.dp-sc-item:hover{border-color:var(--primary-primary-3);background:var(--primary-primary-1);color:var(--primary-primary-7)}
.dp-sc-item.is-active{border-color:var(--primary-primary-6);background:var(--primary-primary-1);color:var(--primary-primary-7);font-weight:600}
.dp-month{flex:none;width:280px;display:flex;flex-direction:column}
.dp-head{position:relative;display:flex;align-items:center;justify-content:center;height:40px;flex:none;box-shadow:inset 0 -1px 0 0 var(--line-color-border-2)}
.dp-cap{display:inline-flex;align-items:center;gap:4px;padding:2px 4px;border:0;border-radius:2px;background:none;font-family:inherit;font-size:14px;line-height:22px;font-weight:600;color:var(--text-color-text-1);font-variant-numeric:tabular-nums;cursor:pointer}
.dp-cap:hover{background:var(--gray-gray-2)}
.dp-cap .icon{width:12px;height:12px;color:var(--text-color-text-3)}
.dp-nav{position:absolute;top:8px;width:24px;height:24px;padding:0;border:0;border-radius:var(--radius-sm);background:none;color:var(--text-color-text-3);cursor:pointer;display:flex;align-items:center;justify-content:center}
.dp-nav:hover{background:var(--gray-gray-2);color:var(--text-color-text-2)}
.dp-nav .icon{width:12px;height:12px}
.dp-nav .flip{transform:scaleX(-1)}
.dp-nav[data-dpnav="l-y"]{left:10px}
.dp-nav[data-dpnav="l-m"]{left:34px}
.dp-nav[data-dpnav="r-m"]{right:34px}
.dp-nav[data-dpnav="r-y"]{right:10px}
.dp-body{padding:16px;display:flex;flex-direction:column;gap:4px}
.dp-wk,.dp-row{display:flex;justify-content:space-between}
.dp-wk span{width:32px;text-align:center;font-size:12px;line-height:20px;padding:6px 0;color:var(--text-color-text-3)}
.dp-day{position:relative;display:flex;align-items:center;justify-content:center;width:32px;height:32px;padding:0;border:0;border-radius:2px;background:none;font-family:inherit;font-size:14px;font-weight:600;line-height:22px;color:var(--text-color-text-1);cursor:pointer;font-variant-numeric:tabular-nums}
.dp-day > span{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:12px}
.dp-day:hover:not(.is-start):not(.is-end):not(.is-omit) > span{background:var(--gray-gray-2)}
.dp-day.is-omit{color:var(--text-color-text-4);cursor:default}
.dp-day.is-in::before,.dp-day.is-start::before,.dp-day.is-end::before{content:"";position:absolute;z-index:0;top:0;bottom:0;left:-6px;right:-6px;background:var(--primary-primary-1)}
.dp-day.is-start::before{left:0;border-radius:16px 0 0 16px}
.dp-day.is-end::before{right:0;border-radius:0 16px 16px 0}
.dp-day.is-start.is-end::before{border-radius:16px}
.dp-day.is-start > span,.dp-day.is-end > span{background:var(--primary-primary-6);color:#fff}
.dp-day.is-today::after{content:"";position:absolute;z-index:2;bottom:1px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--primary-primary-6)}
.dp-mos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding-top:8px}
.dp-mo{height:32px;padding:0;border:0;border-radius:2px;background:none;font-family:inherit;font-size:14px;font-weight:600;line-height:22px;color:var(--text-color-text-1);cursor:pointer;font-variant-numeric:tabular-nums}
.dp-mo:hover{background:var(--gray-gray-2)}
.dp-mo.is-sel{background:var(--primary-primary-1);color:var(--primary-primary-7);box-shadow:inset 0 0 0 1px var(--primary-primary-6)}
/* 周面板：多一列 ISO 周号，8 列 ×32 + 7 道 4px 间隙正好 284 内容宽 */
.dp-month.is-wk{width:316px}
.dp-wdays{display:flex;gap:4px;margin-bottom:6px}
.dp-wday{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:12px;line-height:20px;color:var(--text-color-text-3)}
.dp-wknum{width:32px;height:32px;padding:0;border:0;background:none;display:flex;align-items:center;justify-content:center;font-family:inherit;font-size:14px;line-height:22px;font-weight:600;color:var(--text-color-text-1);cursor:pointer;font-variant-numeric:tabular-nums}
.dp-wknum.is-out{color:var(--text-color-text-4)}
.dp-wknum.is-sel{color:var(--primary-primary-6)}
.dp-month.is-wk .dp-day.is-omit{cursor:pointer}
.dp-month.is-wk .dp-day.is-omit:hover > span{background:var(--gray-gray-2)}
/* 月/年面板：4×3 单元格，行距 16，两端对齐；选中为 12 圆角实心色块 */
.dp-ygrid{display:flex;flex-direction:column;gap:16px}
.dp-yrow{display:flex;justify-content:space-between}
.dp-ycell{width:64px;height:24px;padding:0;border:0;border-radius:12px;background:none;font-family:inherit;font-size:14px;line-height:22px;font-weight:600;color:var(--text-color-text-1);cursor:pointer;font-variant-numeric:tabular-nums}
.dp-ycell:hover{background:var(--gray-gray-2)}
.dp-ycell.is-out{color:var(--text-color-text-4)}
.dp-ycell.is-sel{background:var(--primary-primary-6);color:#fff}

.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:var(--radius-sm);font-size:12px;line-height:16px;white-space:nowrap}
.tag-brand{background:var(--higreen-higreen-tab);color:var(--primary-primary-8)}
.tag-gray{background:var(--gray-gray-2);color:var(--text-color-text-2)}
.tag-red{background:var(--danger-danger-1);color:var(--danger-danger-7)}
.tag-blue{background:var(--info-info-1);color:var(--info-info-7)}

.tc{background:var(--color-white);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:8px;min-width:0;flex:none}
.tc-tabs{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:0 8px;min-height:28px;flex:none}
.tc-cap{margin-right:auto;min-width:0;font-size:12px;line-height:20px;color:var(--text-color-text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-cap b{font-weight:600;color:var(--text-color-text-1)}

  /* 周面板：左侧多一列 ISO 周号，点格或周号都按整周选 */

  function dpPanelHtml(presets){

      + '</div>';
    var panels;
    if(g === '周'){
      panels = dpWeekHtml(base, 'l') + dpWeekHtml(right, 'r');
    }else if(g === '月'){
      panels = dpMonthsHtml(base.y, 'l') + dpMonthsHtml(base.y + 1, 'r');
    }else if(g === '年'){
      var dec = Math.floor(base.y / 10) * 10;
      panels = dpYearsHtml(dec, 'l') + dpYearsHtml(dec + 10, 'r');

      panels = (dpState.modeSide === 'l' ? dpMonthPickerHtml(base, 'l') : dpMonthHtml(base, 'l'))

  /* 面板打开后按触发器位置选左对齐 / 右对齐 / 视口内固定三种落位 */
  function placeDatePanel(wrap){
    var panel = wrap.querySelector('.dp-panel');
    var trig = wrap.querySelector('.u-dsel-tr');
    if(!panel || !trig || !wrap.classList.contains('is-open')) return;
    panel.classList.remove('is-fixed');
    wrap.classList.remove('is-flip');
    panel.style.left = panel.style.top = panel.style.width = '';
    var vw = document.documentElement.clientWidth;
    var vh = window.innerHeight;
    var tr = trig.getBoundingClientRect();
    var pw = panel.offsetWidth;
    if(tr.left + pw <= vw - 8) return;
    if(tr.right - pw >= 8){ wrap.classList.add('is-flip'); return; }
    panel.classList.add('is-fixed');
    var w = Math.min(pw, vw - 16);
    panel.style.width = w + 'px';
    panel.style.left = Math.round((vw - w) / 2) + 'px';
    var ph = panel.offsetHeight;
    var top = Math.round(tr.bottom + 4);
    if(top + ph > vh - 8) top = Math.max(8, vh - ph - 8);
    panel.style.top = top + 'px';
  }

  function fmt(v, unit){
    if(unit === '%'){ return v.toFixed(1) + '%'; }
    if(unit === '元'){ return Math.round(v).toLocaleString('en-US'); }
    return v.toFixed(1);
  }
  function fmtAxis(v, unit){
    if(unit === '%'){ return v.toFixed(1) + '%'; }
    if(unit === '元'){ return Math.round(v).toLocaleString('en-US'); }
    if(Math.abs(v) >= 1000){ return Math.round(v).toLocaleString('en-US'); }
    return v.toFixed(1);
  }
  function money(v, unit){ return fmt(v, unit) + (unit === '%' || unit === '元' ? '' : unit); }

  var TAB_OF_PAGE = { home:'home', metric:'core', finance:'finance' };
  var TAB_STATE = {};

  function snapshotTab(key){
    if(key !== 'core' && key !== 'finance') return;
    TAB_STATE[key] = {
      metric: state.metric, view: state.view, grain: state.grain, dates: state.dates.slice(),
      fbStruct: state.fbStruct, fbPrice: state.fbPrice, fbRank: state.fbRank
    };
  }
  function restoreTab(key){
    var s = TAB_STATE[key];
    if(s){
      state.metric = s.metric; state.view = s.view; state.grain = s.grain; state.dates = s.dates.slice();
      state.fbStruct = s.fbStruct; state.fbPrice = s.fbPrice; state.fbRank = s.fbRank;
      return;
    }
    if(key === 'finance'){
      state.fbStruct = 'chart'; state.fbPrice = 'chart'; state.fbRank = 0;
      state.grain = '月'; state.dates = FB_GRAIN_RANGES['月'].slice();
    }else if(key === 'core'){
      state.metric = 0; state.view = 'chart';
      state.grain = '月'; state.dates = GRAIN_RANGES['月'].slice();
    }
  }
  function syncTabs(){
    var el = document.getElementById('pageTabs');
    if(!el) return;
    var tpl = document.createElement('div');
    tpl.innerHTML = pageTabs();
    el.replaceWith(tpl.firstElementChild);
  }
  function activateTab(key){
    var next = PAGE_OF_TAB[key];
    if(!next) return;
    if(state.page === next){ syncTabs(); return; }
    snapshotTab(TAB_OF_PAGE[state.page]);
    state.page = next;
    restoreTab(key);
    mountPage();
  }
  function openTab(key){
    if(!TAB_META[key] || key === 'home') return;
    if(state.tabs.indexOf(key) === -1) state.tabs.push(key);
    activateTab(key);
  }
  function closeTab(key){
    var i = state.tabs.indexOf(key);
    if(i === -1) return;
    var wasActive = state.page === TAB_META[key].page;
    state.tabs.splice(i, 1);
    if(!wasActive){ syncTabs(); return; }
    if(!state.tabs.length){ state.page = 'home'; mountPage(); return; }
    var nb = state.tabs[Math.min(i, state.tabs.length - 1)];
    state.page = TAB_META[nb].page;
    restoreTab(nb);
    mountPage();
  }

  /* ------------------------------------------------------------------
     报表趋势图
     ------------------------------------------------------------------ */
  function niceScale(lo, hi, count){
    var span = hi - lo || 1;
    var step = Math.pow(10, Math.floor(Math.log(span / count) / Math.LN10));
    var err = span / count / step;
    if(err >= 7.5) step *= 10;
    else if(err >= 3.5) step *= 5;
    else if(err >= 1.5) step *= 2;
    var start = Math.floor(lo / step) * step;
    var end = Math.ceil(hi / step) * step;
    var ticks = [];
    for(var v = start; v <= end + step * 1e-6; v += step) ticks.push(Number(v.toFixed(6)));
    return { lo:start, hi:end, ticks:ticks };
  }

  var chartGeo = null;

  function chartSvg(m){
    var a = m.trend.actual, t = m.trend.target;
    var all = a.concat(t);
    var max = Math.max.apply(null, all);
    var min = Math.min.apply(null, all);
    var pad = (max - min) * 0.18 || max * 0.08 || 1;
    var host = reportPage.querySelector('[data-chart-body]');
    var cw = host ? host.clientWidth : 0;
    var ch = host ? host.clientHeight : 0;
    var small = (cw || 1222) < 640;
    var scale = niceScale(Math.max(0, min - pad), max + pad, small ? 3 : 4);
    var hi = scale.hi;
    var lo = scale.lo;
    var W = Math.max(320, Math.round((cw || 1222) - 8));
    var H = Math.max(150, Math.round((ch || 260) - 40));
    var L = small ? 46 : 62, R = 12, T = 10, B = 24;
    var fs = small ? 10 : 11;
    var labelStep = W < 420 ? 3 : (W < 640 ? 2 : 1);
    var plotW = W - L - R;
    var plotH = H - T - B;
    var span = hi - lo || 1;
    function px(i){ return L + i * plotW / (a.length - 1); }
    function py(v){ return T + (hi - v) / span * plotH; }
    /* 折线一律直线连接，与图表规范的 smooth:false 对齐 */
    function linePath(values){
      var pts = values.map(function(v,i){ return { x:px(i), y:py(v) }; });
      var d = 'M ' + pts[0].x.toFixed(2) + ' ' + pts[0].y.toFixed(2);
      for(var i=1;i<pts.length;i++){
        d += ' L ' + pts[i].x.toFixed(2) + ' ' + pts[i].y.toFixed(2);
      }
      return d;
    }
    var actualPath = linePath(a);
    var areaPath = actualPath + ' L ' + px(a.length - 1).toFixed(2) + ' ' + (T + plotH).toFixed(2) + ' L ' + L + ' ' + (T + plotH).toFixed(2) + ' Z';
    var targetPath = linePath(t);

    var grid = '';
    scale.ticks.forEach(function(v, i){
      var y = py(v);
      grid += '<line x1="' + L + '" y1="' + y.toFixed(2) + '" x2="' + (W-R) + '" y2="' + y.toFixed(2) + '" stroke="var(--chart-grid)" stroke-width="1" stroke-dasharray="' + (i === 0 ? '0' : '4 4') + '"/>'
        + '<text x="' + (L-8) + '" y="' + (y+4).toFixed(2) + '" text-anchor="end" font-size="' + fs + '" fill="var(--text-color-text-3)" style="font-variant-numeric:tabular-nums">' + fmtAxis(v, m.unit) + '</text>';
    });
    var xAxis = '';
    MONTHS.forEach(function(label, i){
      var last = i === MONTHS.length - 1;
      if(i % labelStep !== 0 && !last) return;
      xAxis += '<text x="' + px(i).toFixed(2) + '" y="' + (H-6) + '" text-anchor="middle" font-size="' + fs + '" fill="var(--text-color-text-2)">' + label + '</text>';
      xAxis += '<line x1="' + px(i).toFixed(2) + '" y1="' + (T+plotH) + '" x2="' + px(i).toFixed(2) + '" y2="' + (T+plotH+4) + '" stroke="var(--chart-axis)" stroke-width="1"/>';
    });
    /* 悬停几何存在 viewBox 坐标里，指针事件按容器实测宽度换算，等价于组件的 axis tooltip */
    chartGeo = {
      xs:a.map(function(_, i){ return px(i); }),
      ay:a.map(function(v){ return py(v); }),
      ty:t.map(function(v){ return py(v); }),
      W:W,
      unit:m.unit,
      actual:a,
      target:t
    };
    return '<div class="tc-legend">'
      + '<span><i aria-hidden="true"></i>实际值</span>'
      + '<span><i class="is-target" aria-hidden="true"></i>目标值</span>'
      + '</div>'
      + '<div class="tc-plot">'
      + '<svg class="tc-svg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="' + m.title + '近 12 个月实际值与目标值趋势">'
      + '<defs><linearGradient id="gActual" x1="0" y1="0" x2="0" y2="1">'
      + '<stop offset="0" stop-color="var(--tc-color)" stop-opacity=".22"></stop>'
      + '<stop offset="1" stop-color="var(--tc-color)" stop-opacity="0"></stop>'
      + '</linearGradient></defs>'
      + grid + xAxis
      + '<path d="' + areaPath + '" fill="url(#gActual)"></path>'
      + '<path d="' + targetPath + '" fill="none" stroke="var(--businesssemantic-bs-target)" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round"></path>'
      + '<path d="' + actualPath + '" fill="none" stroke="var(--tc-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>'
      + '<g class="tc-hover" visibility="hidden">'
      + '<line class="tc-guide" x1="0" y1="' + T + '" x2="0" y2="' + (T+plotH) + '" stroke="var(--gray-gray-4)" stroke-width="1" stroke-dasharray="3 3"></line>'
      + '<circle class="tc-hdot-a" r="4" fill="var(--tc-color)" stroke="#fff" stroke-width="2"></circle>'
      + '<circle class="tc-hdot-t" r="4" fill="var(--businesssemantic-bs-target)" stroke="#fff" stroke-width="2"></circle>'
      + '</g>'
      + '</svg>'
      + '<div class="tc-tip" hidden></div>'
      + '</div>';
  }

  function chartTable(m){
    var rows = m.trend.actual.map(function(a, i){
      var t = m.trend.target[i];
      var rate = a / t * 100;
      var mom = i === 0 ? null : (a / m.trend.actual[i-1] - 1) * 100;
      var status = rate >= 100 ? '达成' : '未达成';
      var tagCls = rate >= 100 ? 'tag-brand' : 'tag-blue';
      var momCls = mom === null ? '' : (mom >= 0 ? 'up' : 'down');
      var momTxt = mom === null ? '—' : (mom >= 0 ? '+' : '') + mom.toFixed(1) + '%';
      return '<tr>'
        + '<td>' + MONTHS[i] + '</td>'
        + '<td class="n">' + fmt(a, m.unit) + '</td>'
        + '<td class="n">' + fmt(t, m.unit) + '</td>'
        + '<td class="n">' + rate.toFixed(1) + '%</td>'
        + '<td><span class="tag ' + tagCls + '">' + status + '</span></td>'
        + '<td class="n ' + momCls + '">' + momTxt + '</td>'
        + '</tr>';
    }).join('');
    var u = m.unit === '%' ? '%' : m.unit;
    return '<div class="tc-tablewrap"><table class="data-table">'

  function tipVal(v, u){ return u === '元' ? fmt(v, u) + '元' : money(v, u); }

  /* 悬停 = 组件趋势图的 axis tooltip：竖线 + 双系列高亮点 + 白底浮层 */
  function onChartPointer(e){
    var body = reportPage.querySelector('[data-chart-body]');
    if(!body || !chartGeo) return;
    var svg = body.querySelector('.tc-svg');
    if(!svg) return;
    var r = svg.getBoundingClientRect();
    if(!r.width || !r.height) return;
    if(e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom){
      hideChartTip();
      return;
    }
    var g = chartGeo;
    var last = g.xs.length - 1;
    var rel = (e.clientX - r.left) / r.width * g.W;
    var idx = Math.round((rel - g.xs[0]) / (g.xs[last] - g.xs[0]) * last);
    idx = Math.max(0, Math.min(last, idx));

    var hov = svg.querySelector('.tc-hover');
    var guide = hov.querySelector('.tc-guide');
    guide.setAttribute('x1', g.xs[idx].toFixed(2));
    guide.setAttribute('x2', g.xs[idx].toFixed(2));
    var da = hov.querySelector('.tc-hdot-a');
    da.setAttribute('cx', g.xs[idx].toFixed(2));
    da.setAttribute('cy', g.ay[idx].toFixed(2));
    var dt = hov.querySelector('.tc-hdot-t');
    dt.setAttribute('cx', g.xs[idx].toFixed(2));
    dt.setAttribute('cy', g.ty[idx].toFixed(2));
    hov.setAttribute('visibility', 'visible');

    var tip = body.querySelector('.tc-tip');
    var act = g.actual[idx], tgt = g.target[idx];
    var rate = tgt ? (act / tgt * 100).toFixed(1) + '%' : '—';
    tip.innerHTML = '<div class="tc-tip-m">' + MONTHS[idx] + '</div>'
      + '<div class="tc-tip-r"><span class="tc-tip-k"><i></i>实际值</span><b class="tc-tip-v">' + tipVal(act, g.unit) + '</b></div>'
      + '<div class="tc-tip-r"><span class="tc-tip-k"><i class="is-target"></i>目标值</span><b class="tc-tip-v">' + tipVal(tgt, g.unit) + '</b></div>'
      + '<div class="tc-tip-r"><span class="tc-tip-k">完成率</span><b class="tc-tip-v">' + rate + '</b></div>';
    tip.hidden = false;

    /* 浮层贴指针右侧，靠边时翻到左侧，避免盖住竖线与高亮点 */
    var plotX = g.xs[idx] / g.W * r.width;
    var tipW = tip.offsetWidth;
    var left = plotX + 12;
    if(left + tipW > r.width - 4) left = plotX - tipW - 12;
    tip.style.left = Math.max(4, left) + 'px';
    var top = e.clientY - r.top - 16;
    top = Math.max(4, Math.min(r.height - tip.offsetHeight - 4, top));
    tip.style.top = top + 'px';
  }

  /* ------------------------------------------------------------------
     财务开单图表（SVG，窗口自适应重绘）
     ------------------------------------------------------------------ */
  var fbGeo = {};

  function fbLegendHtml(names, colors, bar){
    return '<div class="tc-legend' + (bar ? ' is-bar' : '') + '">'
      + names.map(function(n, i){
          return '<span><i style="background:' + colors[i] + '" aria-hidden="true"></i>' + n + '</span>';
        }).join('')
      + '</div>';
  }

  /* 柱顶 2px 圆角、底边直角，对齐组件库 ECharts 的 borderRadius:[2,2,0,0] */
  function topRoundedBar(x, y, w, h, r){
    if(h <= 0 || w <= 0) return '';
    r = Math.min(r, w / 2, h);
    var f = function(n){ return n.toFixed(2); };
    return 'M' + f(x) + ' ' + f(y + h)
      + 'V' + f(y + r)
      + 'Q' + f(x) + ' ' + f(y) + ' ' + f(x + r) + ' ' + f(y)
      + 'H' + f(x + w - r)
      + 'Q' + f(x + w) + ' ' + f(y) + ' ' + f(x + w) + ' ' + f(y + r)
      + 'V' + f(y + h) + 'Z';
  }

  function fbStructSvg(){
    var host = reportPage.querySelector('[data-fb-struct]');
    if(!host) return '';
    var cw = host.clientWidth || 400, ch = host.clientHeight || 240;
    var W = Math.max(300, Math.round(cw - 8));
    var H = Math.max(170, Math.round(ch - 32));
    var L = 40, R = 10, T = 24, B = 24;
    var plotW = W - L - R, plotH = H - T - B;
    var cols = FB_STRUCT.groups.length * FB_STRUCT.cats.length;
    var slot = plotW / cols;
    var barW = Math.min(56, slot * 0.52);
    var n = FB_STRUCT.legend.length;
    function py(v){ return T + (100 - v) / 100 * plotH; }
    var grid = '';
    [0, 25, 50, 75, 100].forEach(function(v, i){
      var y = py(v);
      grid += '<line x1="' + L + '" y1="' + y + '" x2="' + (W - R) + '" y2="' + y + '" stroke="var(--chart-grid)" stroke-width="1" stroke-dasharray="' + (i === 0 ? '0' : '4 4') + '"/>'
        + '<text x="' + (L - 8) + '" y="' + (y + 4) + '" text-anchor="end" font-size="11" fill="var(--text-color-text-3)" style="font-variant-numeric:tabular-nums">' + v + '%</text>';
    });
    var groupLabels = '', xLabels = '', bars = '';
    FB_STRUCT.groups.forEach(function(g, gi){
      var gx = L + gi * slot * FB_STRUCT.cats.length;
      groupLabels += '<text x="' + (gx + slot * FB_STRUCT.cats.length / 2) + '" y="' + (T - 10) + '" text-anchor="middle" font-size="12" fill="var(--text-color-text-2)">' + g + '</text>';
    });
    for(var c = 0; c < cols; c++){
      var x = L + slot * c + (slot - barW) / 2;
      var acc = 0;
      for(var s = 0; s < n; s++){
        var v = FB_STRUCT.series[s][c];
        var y1 = py(acc + v), y2 = py(acc);
        var segH = Math.max(0, y2 - y1);
        /* 堆积图只圆最上段，中间段保持直角 */
        bars += (s === n - 1)
          ? '<path d="' + topRoundedBar(x, y1, barW, segH, 2) + '" fill="' + FB_STRUCT.colors[s] + '"/>'
          : '<rect x="' + x.toFixed(2) + '" y="' + y1.toFixed(2) + '" width="' + barW.toFixed(2) + '" height="' + segH.toFixed(2) + '" fill="' + FB_STRUCT.colors[s] + '"/>';
        acc += v;
      }
      xLabels += '<text x="' + (x + barW / 2) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="11" fill="var(--text-color-text-3)">' + FB_STRUCT.cats[c % FB_STRUCT.cats.length] + '</text>';
    }
    return fbLegendHtml(FB_STRUCT.legend, FB_STRUCT.colors, true)
      + '<div class="tc-plot"><svg class="tc-svg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="产品结构百分比堆积柱状图">'
      + grid + groupLabels + bars + xLabels
      + '</svg></div>';
  }

  function fbStructTable(){
    var head = '<thead><tr><th>产品结构</th>' + FB_STRUCT.legend.map(function(l){ return '<th>' + l + '</th>'; }).join('') + '</tr></thead>';
    var cols = FB_STRUCT.groups.length * FB_STRUCT.cats.length;
    var rows = '';
    for(var c = 0; c < cols; c++){
      var name = FB_STRUCT.groups[Math.floor(c / FB_STRUCT.cats.length)] + '-' + FB_STRUCT.cats[c % FB_STRUCT.cats.length];
      rows += '<tr><td>' + name + '</td>'
        + FB_STRUCT.series.map(function(s){ return '<td>' + s[c] + '%</td>'; }).join('')
        + '</tr>';
    }
    return '<div class="fb-twrap"><table class="fb-t">' + head + '<tbody>' + rows + '</tbody></table></div>';
  }

  function fbPriceSvg(){
    var host = reportPage.querySelector('[data-fb-price]');
    if(!host) return '';
    var cw = host.clientWidth || 1222, ch = host.clientHeight || 260;
    var W = Math.max(320, Math.round(cw - 8));
    var H = Math.max(170, Math.round(ch - 32));
    var L = 46, R = 26, T = 10, B = 24;
    var plotW = W - L - R, plotH = H - T - B;
    var maxV = 40;
    var fs = W < 640 ? 10 : 11;
    var labelStep = W < 420 ? 3 : (W < 640 ? 2 : 1);
    var n = FB_MONTHS.length;
    function px(i){ return L + i * plotW / (n - 1); }
    function py(v){ return T + (maxV - v) / maxV * plotH; }
    /* 折线一律直线连接，与图表规范的 smooth:false 对齐 */
    function linePath(values){
      var pts = values.map(function(v, i){ return { x:px(i), y:py(v) }; });
      var d = 'M ' + pts[0].x.toFixed(2) + ' ' + pts[0].y.toFixed(2);
      for(var i = 1; i < pts.length; i++){
        d += ' L ' + pts[i].x.toFixed(2) + ' ' + pts[i].y.toFixed(2);
      }
      return d;
    }
    var grid = '';
    [0, 10, 20, 30, 40].forEach(function(v, i){
      var y = py(v);
      grid += '<line x1="' + L + '" y1="' + y + '" x2="' + (W - R) + '" y2="' + y + '" stroke="var(--chart-grid)" stroke-width="1" stroke-dasharray="' + (i === 0 ? '0' : '4 4') + '"/>'
        + '<text x="' + (L - 8) + '" y="' + (y + 4) + '" text-anchor="end" font-size="' + fs + '" fill="var(--text-color-text-3)" style="font-variant-numeric:tabular-nums">' + v + '%</text>';
    });
    var xAxis = '';
    FB_MONTHS.forEach(function(label, i){
      var last = i === n - 1;
      if(i % labelStep !== 0 && !last) return;
      xAxis += '<text x="' + px(i).toFixed(2) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="' + fs + '" fill="var(--text-color-text-2)">' + label + '</text>';
    });
    var paths = FB_PRICE.series.map(function(s, i){
      return '<path d="' + linePath(s) + '" fill="none" stroke="' + FB_PRICE.colors[i] + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>';
    }).join('');
    var dots = FB_PRICE.series.map(function(s, i){
      return '<circle r="3" fill="' + FB_PRICE.colors[i] + '" stroke="#fff" stroke-width="1.5"></circle>';
    }).join('');
    fbGeo.price = {
      kind:'line', n:n, xs:FB_MONTHS.map(function(_, i){ return px(i); }), W:W,
      ys:FB_PRICE.series.map(function(s){ return s.map(function(v){ return py(v); }); }),
      tip:function(i){
        var h = '<div class="tc-tip-m">' + FB_MONTHS[i] + '</div>';
        FB_PRICE.legend.forEach(function(name, s){
          h += '<div class="tc-tip-r"><span class="tc-tip-k"><i style="background:' + FB_PRICE.colors[s] + '"></i>' + name + '</span><b class="tc-tip-v">' + FB_PRICE.series[s][i].toFixed(1) + '%</b></div>';
        });
        return h;
      }
    };
    return fbLegendHtml(FB_PRICE.legend, FB_PRICE.colors)
      + '<div class="tc-plot">'
      + '<svg class="tc-svg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="品类均价趋势，201601-201611">'
      + grid + xAxis + paths
      + '<g class="fb-hover" visibility="hidden">'
      + '<line class="fb-guide" x1="0" y1="' + T + '" x2="0" y2="' + (T + plotH) + '" stroke="var(--gray-gray-4)" stroke-width="1" stroke-dasharray="3 3"></line>'
      + dots
      + '</g>'
      + '</svg>'
      + '<div class="tc-tip" hidden></div>'
      + '</div>';
  }

  function fbPriceTable(){
    var head = '<thead><tr><th>月份</th>' + FB_PRICE.legend.map(function(l){ return '<th>' + l + '</th>'; }).join('') + '</tr></thead>';
    var rows = FB_MONTHS.map(function(m, i){
      return '<tr><td>' + m + '</td>'
        + FB_PRICE.series.map(function(s){ return '<td>' + s[i].toFixed(1) + '%</td>'; }).join('')
        + '</tr>';
    }).join('');
    return '<div class="fb-twrap"><table class="fb-t">' + head + '<tbody>' + rows + '</tbody></table></div>';
  }

  function fbRankSvg(){
    var host = reportPage.querySelector('[data-fb-rank]');
    if(!host) return '';
    var isModel = state.fbRank === 2;
    var cats = isModel ? FB_RANK_MODEL_CATS : FB_RANK_CATS;
    var data = state.fbRank === 1 ? FB_RANK_STAR : isModel ? FB_RANK_MODEL : FB_RANK;
    var cw = host.clientWidth || 1222, ch = host.clientHeight || 300;
    var W = Math.max(320, Math.round(cw - 8));
    var H = Math.max(200, Math.round(ch - 32));
    var L = 46, R = 10, T = 10, B = 46;
    var maxV = 400;
    var n = cats.length;
    var dense = n > 12;
    if(dense) B = 58;
    var plotW = W - L - R, plotH = H - T - B;
    var slot = plotW / n;
    var pairW = Math.min(34, slot * 0.62);
    var barW = Math.max(2, (pairW - 2) / 2);
    var fs = W < 700 ? 10 : 11;
    var xfs = dense ? 10 : fs;
    var labelStep = W < 520 ? 4 : (W < 760 ? 3 : (dense ? 2 : (W < 1000 ? 2 : 1)));
    function py(v){ return T + (maxV - v) / maxV * plotH; }
    var grid = '';
    [0, 100, 200, 300, 400].forEach(function(v, i){
      var y = py(v);
      grid += '<line x1="' + L + '" y1="' + y + '" x2="' + (W - R) + '" y2="' + y + '" stroke="var(--chart-grid)" stroke-width="1" stroke-dasharray="' + (i === 0 ? '0' : '4 4') + '"/>'
        + '<text x="' + (L - 8) + '" y="' + (y + 4) + '" text-anchor="end" font-size="' + fs + '" fill="var(--text-color-text-3)" style="font-variant-numeric:tabular-nums">' + v + '</text>';
    });
    var bars = '', xLabels = '';
    for(var i = 0; i < n; i++){
      var cx = L + slot * i + slot / 2;
      for(var s = 0; s < 2; s++){
        var v = data[s].values[i];
        var x = cx - pairW / 2 + s * (barW + 2);
        bars += '<path d="' + topRoundedBar(x, py(v), barW, T + plotH - py(v), 2) + '" fill="' + data[s].color + '"/>';
      }
      if(i % labelStep === 0){
        var lx = (cx - 2).toFixed(2), ly = H - (dense ? 44 : 32);
        xLabels += '<text class="fb-xrot" x="' + lx + '" y="' + ly + '" text-anchor="end" font-size="' + xfs + '" transform="rotate(' + (dense ? -42 : -38) + ' ' + lx + ' ' + ly + ')">' + cats[i] + '</text>';
      }
    }
    fbGeo.rank = {
      kind:'bar', n:n, x0:L + slot / 2, dx:slot, W:W,
      tip:function(i){
        var h = '<div class="tc-tip-m">' + cats[i] + '</div>';
        data.forEach(function(sr){
          h += '<div class="tc-tip-r"><span class="tc-tip-k"><i style="background:' + sr.color + '"></i>' + sr.name + '</span><b class="tc-tip-v">' + sr.values[i] + '</b></div>';
        });
        return h;
      }
    };
    return fbLegendHtml(data.map(function(d){ return d.name; }), data.map(function(d){ return d.color; }), true)
      + '<div class="tc-plot">'
      + '<svg class="tc-svg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="' + (isModel ? '重点机型完成率排名' : '中心完成率排名') + '柱状图">'
      + grid + bars + xLabels
      + '<g class="fb-hover" visibility="hidden">'
      + '<line class="fb-guide" x1="0" y1="' + T + '" x2="0" y2="' + (T + plotH) + '" stroke="var(--gray-gray-4)" stroke-width="1" stroke-dasharray="3 3"></line>'
      + '</g>'
      + '</svg>'
      + '<div class="tc-tip" hidden></div>'
      + '</div>';
  }

  function hideFbTip(){

  /* 财务开单图表悬停：折线图竖线 + 系列圆点；柱形图竖线；白底浮层靠边自动翻向 */
  function onFbPointer(e){
    var plot = e.target.closest ? e.target.closest('[data-fb-plot]') : null;
    if(!plot || !reportPage.contains(plot)){ hideFbTip(); return; }
    var g = fbGeo[plot.getAttribute('data-fb-plot')];
    var svg = plot.querySelector('svg');
    if(!g || !svg) return;
    var r = svg.getBoundingClientRect();
    if(!r.width || !r.height || e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom){
      hideFbTip();
      return;
    }
    var rel = (e.clientX - r.left) / r.width * g.W;
    var idx = Math.max(0, Math.min(g.n - 1, Math.round((rel - (g.xs ? g.xs[0] : g.x0)) / (g.xs ? (g.xs[g.n - 1] - g.xs[0]) / (g.n - 1) : g.dx))));
    var x = g.xs ? g.xs[idx] : g.x0 + idx * g.dx;
    var hov = svg.querySelector('.fb-hover');
    if(hov){
      var guide = hov.querySelector('.fb-guide');
      guide.setAttribute('x1', x.toFixed(2));
      guide.setAttribute('x2', x.toFixed(2));
      var dots = hov.querySelectorAll('circle');
      if(g.ys && dots.length){
        dots.forEach(function(d, s){
          d.setAttribute('cx', x.toFixed(2));
          d.setAttribute('cy', g.ys[s][idx].toFixed(2));
        });
      }
      hov.setAttribute('visibility', 'visible');
    }
    var tip = plot.querySelector('.tc-tip');
    if(!tip) return;
    tip.innerHTML = g.tip(idx);
    tip.hidden = false;
    var plotX = x / g.W * r.width;
    var tipW = tip.offsetWidth;
    var left = plotX + 12;
    if(left + tipW > r.width - 4) left = plotX - tipW - 12;
    tip.style.left = Math.max(4, left) + 'px';
    var top = e.clientY - r.top - 16;
    top = Math.max(4, Math.min(r.height - tip.offsetHeight - 4, top));
    tip.style.top = top + 'px';
  }

  function setGrain(g){
    closeDropdowns();
    /* 切维度不清空已选值，只把起止对齐到新粒度（选到 06-09，切「月」显示 2025-06） */
    if(state.grain !== g){
      var a = dpNormDim(dpParse(state.dates[0]), g);
      var b = dpNormDim(dpParse(state.dates[1]), g);
      if(dpUtc(a) > dpUtc(b)){ var t = a; a = b; b = t; }
      state.grain = g;
      state.dates = [dpStore(a), dpStore(b)];
      dpState.base = null;
      dpState.anchor = null;
      dpState.hover = null;
      dpState.modeSide = null;
    }
    reportPage.querySelectorAll('[data-grain] span[data-g]').forEach(function(el){
      var on = el.getAttribute('data-g') === g;
      el.classList.toggle('is-on', on);
      el.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    var start = reportPage.querySelector('[data-date-start]');
    var end = reportPage.querySelector('[data-date-end]');
    if(start) start.textContent = dpText(0);
    if(end) end.textContent = dpText(1);
    toast('统计粒度：' + g);
  }

  /* ------------------------------------------------------------------

  function bindReport(){
    reportPage.addEventListener('click', onReportClick);
    reportPage.addEventListener('keydown', onReportKeydown);
    reportPage.addEventListener('mouseover', onDateHover);
    reportPage.addEventListener('mouseout', onDateHoverOut);
    reportPage.addEventListener('pointermove', onChartPointer);
    reportPage.addEventListener('pointerdown', onChartPointer);
    reportPage.addEventListener('pointerleave', hideChartTip);
    reportPage.addEventListener('pointermove', onFbPointer);
    reportPage.addEventListener('pointerdown', onFbPointer);
    reportPage.addEventListener('pointerleave', hideFbTip);
  }
  function unbindReport(){
    reportPage.removeEventListener('click', onReportClick);
    reportPage.removeEventListener('keydown', onReportKeydown);
    reportPage.removeEventListener('mouseover', onDateHover);
    reportPage.removeEventListener('mouseout', onDateHoverOut);
    reportPage.removeEventListener('pointermove', onChartPointer);
    reportPage.removeEventListener('pointerdown', onChartPointer);
    reportPage.removeEventListener('pointerleave', hideChartTip);
    reportPage.removeEventListener('pointermove', onFbPointer);
    reportPage.removeEventListener('pointerdown', onFbPointer);
    reportPage.removeEventListener('pointerleave', hideFbTip);
  }

  /* 第一次点落端点，第二次点写回区间并收起；日/周/月/年共用 */
  function dpPick(wrap, dt){
    dt = dpNormDim(dt, state.grain);
    if(!dpState.anchor){
      dpState.anchor = dt;
      dpState.hover = null;
      /* 只改类名不重建 DOM：重建会让点击目标脱离文档，冒泡到 document 时被当成外部点击把面板关掉 */
      paintDpRange(wrap);
      wrap.querySelectorAll('.dp-sc-item').forEach(function(it){
        it.classList.remove('is-active');
        it.setAttribute('aria-selected', 'false');
      });
      return;
    }
    var a = dpState.anchor;
    dpState.anchor = null;
    commitDates(wrap, a, dt);
    closeDropdowns();
  }
  /* 悬停取当前维度对应的预值：周取整周周日、月取 1 日、年取 1 月 1 日 */
  function dpHoverDate(target){
    var g = state.grain;
    if(g === '周'){
      var wc = target.closest('[data-dpwk]');
      if(wc) return dpWeekSunday(dpMondayOfWeek(+wc.getAttribute('data-dpwk')));
      var wd = target.closest('.dp-day[data-dpd]');
      if(!wd) return null;
      var wp = wd.getAttribute('data-dpd').split('/').map(Number);
      return dpWeekSunday({ y:wp[0], m:wp[1], d:wp[2] });
    }
    if(g === '月'){
      var mc = target.closest('[data-dpmon]');
      if(!mc) return null;
      var mk = +mc.getAttribute('data-dpmon');
      return { y:Math.floor(mk / 12), m:mk % 12 + 1, d:1 };
    }
    if(g === '年'){
      var yc = target.closest('[data-dpyr]');
      if(!yc) return null;
      return { y:+yc.getAttribute('data-dpyr'), m:1, d:1 };
    }
    var day = target.closest('.dp-day[data-dpd]');
    if(!day) return null;
    var p = day.getAttribute('data-dpd').split('/').map(Number);
    return { y:p[0], m:p[1], d:p[2] };
  }
  /* 选定起始日后，悬停日期实时预览区间；移出面板清掉预览 */
  function onDateHover(e){
    if(!dpState.anchor) return;
    var dt = dpHoverDate(e.target);
    if(!dt) return;
    if(dpState.hover && dpUtc(dpState.hover) === dpUtc(dt)) return;
    dpState.hover = dt;
    var panel = e.target.closest('.dp-panel');
    if(panel) paintDpRange(panel.closest('.dd-wrap'));
  }
  function onDateHoverOut(e){
    var panel = e.target.closest('.dp-panel');
    if(!panel) return;
    if(e.relatedTarget && panel.contains(e.relatedTarget)) return;
    if(!dpState.anchor || !dpState.hover) return;
    dpState.hover = null;
    paintDpRange(panel.closest('.dd-wrap'));
  }

  function onReportClick(e){
    var navToggle = e.target.closest('[data-nav-toggle]');
    if(navToggle){
      var snEl = document.getElementById('sideNav');
      setNav(!(snEl && snEl.classList.contains('is-open')));
      return;
    }

    var card = e.target.closest('.tc-card');
    if(card && reportPage.contains(card)){
      state.metric = Number(card.getAttribute('data-i'));
      syncMetricCards();
      renderTrend();
      return;
    }

    var tab = e.target.closest('.tc-tab');
    if(tab && tab.hasAttribute('data-view')){
      state.view = tab.getAttribute('data-view');
      syncViewTabs();
      renderTrend();
      return;
    }

    var grain = e.target.closest('[data-g]');
    if(grain){ setGrain(grain.getAttribute('data-g')); return; }

    var ddBtn = e.target.closest('.dd-wrap > button');
    if(ddBtn){
      var wrap = ddBtn.closest('.dd-wrap');
      var willOpen = !wrap.classList.contains('is-open');
      closeDropdowns(wrap);
      wrap.classList.toggle('is-open', willOpen);
      ddBtn.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
      if(willOpen && wrap.getAttribute('data-dd') === 'date'){
        dpInitBase();
        renderDp(wrap);
        requestAnimationFrame(function(){ placeDatePanel(wrap); });
      }
      return;
    }

    var dpCap = e.target.closest('[data-dpcap]');
    if(dpCap){
      var capWrap = dpCap.closest('.dd-wrap');
      var side = dpCap.getAttribute('data-dpcap');
      dpState.modeSide = dpState.modeSide === side ? null : side;
      renderDp(capWrap);
      return;
    }

    var dpMo = e.target.closest('[data-dpm]');
    if(dpMo && state.grain === '日'){
      var moWrap = dpMo.closest('.dd-wrap');
      var mp = dpMo.getAttribute('data-dpm').split('|');
      var mo = { y:+mp[1], m:+mp[2] };
      dpState.base = mp[0] === 'r' ? dpNorm({ y:mo.y, m:mo.m - 1, d:1 }) : mo;
      dpState.modeSide = null;
      renderDp(moWrap);
      return;
    }

    var dpNav = e.target.closest('[data-dpnav]');
    if(dpNav){
      var navWrap = dpNav.closest('.dd-wrap');
      var k = dpNav.getAttribute('data-dpnav');
      var add = k === 'l-y' ? -12 : k === 'l-m' ? -1 : k === 'r-m' ? 1 : 12;
      if(state.grain === '年' && (k === 'l-y' || k === 'r-y')) add *= 10;
      var total = dpState.base.y * 12 + (dpState.base.m - 1) + add;
      dpState.base = { y:Math.floor(total / 12), m:total % 12 + 1 };
      renderDp(navWrap);
      return;
    }

    var dpWk = e.target.closest('[data-dpwk]');
    if(dpWk && state.grain === '周'){
      dpPick(dpWk.closest('.dd-wrap'), dpMondayOfWeek(+dpWk.getAttribute('data-dpwk')));
      return;
    }

    var dpMon = e.target.closest('[data-dpmon]');
    if(dpMon && state.grain === '月'){
      var mk = +dpMon.getAttribute('data-dpmon');
      dpPick(dpMon.closest('.dd-wrap'), { y:Math.floor(mk / 12), m:mk % 12 + 1, d:1 });
      return;
    }

    var dpYr = e.target.closest('[data-dpyr]');
    if(dpYr && state.grain === '年'){
      dpPick(dpYr.closest('.dd-wrap'), { y:+dpYr.getAttribute('data-dpyr'), m:1, d:1 });
      return;
    }

    var dpDay = e.target.closest('.dp-day');
    if(dpDay){
      var p = dpDay.getAttribute('data-dpd').split('/').map(Number);
      dpPick(dpDay.closest('.dd-wrap'), { y:p[0], m:p[1], d:p[2] });
      return;
    }

    var scItem = e.target.closest('.dp-sc-item');
    if(scItem){
      var scWrap = scItem.closest('.dd-wrap');
      var parts = scItem.getAttribute('data-date').split('|');
      dpState.anchor = null;
      commitDates(scWrap, dpParse(parts[0]), dpParse(parts[1]));
      closeDropdowns();
      return;
    }

    var ddItem = e.target.closest('.dd-item');
    if(ddItem){
      setSelect(ddItem.closest('.dd-wrap'), ddItem);
      closeDropdowns();
      return;
    }

    var reset = e.target.closest('[data-reset]');
    if(reset){
      mountPage();
      toast('已重置筛选条件');
      return;
    }

    var fbv = e.target.closest('[data-fbview]');
    if(fbv){
      var parts = fbv.getAttribute('data-fbview').split(':');
      state[parts[0]] = parts[1];
      fbv.parentElement.querySelectorAll('.tc-tab').forEach(function(t){
        t.classList.toggle('is-on', t.getAttribute('data-fbview') === parts[0] + ':' + parts[1]);
      });
      renderFbCharts();
      return;
    }

    var rtab = e.target.closest('[data-fbrank]');
    if(rtab){
      state.fbRank = Number(rtab.getAttribute('data-fbrank'));
      reportPage.querySelectorAll('[data-fbrank]').forEach(function(t){
        t.classList.toggle('is-on', Number(t.getAttribute('data-fbrank')) === state.fbRank);
      });
      renderFbCharts();
      return;
    }

    var detail = e.target.closest('[data-fb-detail]');
    if(detail){
      toast('演示模板：财务开单明细为示例按钮');
      return;
    }

    var more = e.target.closest('[data-ai-more]');
    if(more){
      var row = more.closest('.u-ai-row');
      var open = !row.classList.contains('is-open');
      row.classList.toggle('is-open', open);
      more.setAttribute('aria-expanded', open ? 'true' : 'false');
      var aiBox = row.closest('[data-ai]');
      var allBtn = aiBox.querySelector('[data-ai-all]');
      if(allBtn){
        var allOpen = aiBox.querySelectorAll('.u-ai-row').length === aiBox.querySelectorAll('.u-ai-row.is-open').length;
        allBtn.textContent = allOpen ? '收起全部' : '一键展开';
        allBtn.setAttribute('aria-expanded', allOpen ? 'true' : 'false');
      }
      return;
    }

    var all = e.target.closest('[data-ai-all]');
    if(all){
      var ai = all.closest('[data-ai]');
      var rows = ai.querySelectorAll('.u-ai-row');
      var allOpen = ai.querySelectorAll('.u-ai-row.is-open').length === rows.length;
      rows.forEach(function(r){
        r.classList.toggle('is-open', !allOpen);
        var b = r.querySelector('[data-ai-more]');
        if(b) b.setAttribute('aria-expanded', !allOpen ? 'true' : 'false');
      });
      all.textContent = allOpen ? '一键展开' : '收起全部';
      all.setAttribute('aria-expanded', allOpen ? 'false' : 'true');
      return;
    }

    var tabClose = e.target.closest('.ptab-x');
    if(tabClose){ closeTab(tabClose.closest('.ptab').getAttribute('data-tab')); return; }

    var tabFav = e.target.closest('.ptab-fav');
    if(tabFav){ toggleTabFav(tabFav.closest('.ptab').getAttribute('data-tab')); return; }

    var ptab = e.target.closest('.ptab');
    if(ptab){
      if(!ptab.classList.contains('is-active')) activateTab(ptab.getAttribute('data-tab'));
      return;
    }

    var opener = e.target.closest('[data-open-tab]');
    if(opener){ openTab(opener.getAttribute('data-open-tab')); return; }

    var l1 = e.target.closest('.sn-l1');
    if(l1){
      var l1Page = l1.getAttribute('data-page');
      if(l1Page){
        if(l1Page !== state.page) activateTab(TAB_OF_PAGE[l1Page]);
        setNav(false);
        return;
      }
      var sub = l1.nextElementSibling;
      if(sub && sub.classList.contains('sn-sub')){
        var open = sub.classList.toggle('is-fold') === false;
        l1.classList.toggle('is-open', open);
        l1.setAttribute('aria-expanded', open ? 'true' : 'false');
      } else {
        toast('演示模板：该模块未包含在示例中');
      }
      return;
    }

    var leaf = e.target.closest('.sn-l2');
    if(leaf && !leaf.classList.contains('is-on')){
      var tabKey = leaf.getAttribute('data-tab');
      if(tabKey){ openTab(tabKey); setNav(false); }
      else toast('演示模板：该模块未包含在示例中');
      return;
    }
  }

  function onReportKeydown(e){
    var ptab = e.target.closest('.ptab');
    if(ptab){
      var tabs = Array.prototype.slice.call(reportPage.querySelectorAll('.ptab'));
      if(e.key === 'ArrowLeft' || e.key === 'ArrowRight'){
        e.preventDefault();
        var step = e.key === 'ArrowRight' ? 1 : -1;
        var nxt = tabs[(tabs.indexOf(ptab) + step + tabs.length) % tabs.length];
        if(nxt) nxt.focus();
        return;
      }
      if(e.target === ptab && (e.key === 'Enter' || e.key === ' ')){
        e.preventDefault();
        activateTab(ptab.getAttribute('data-tab'));
        var act = reportPage.querySelector('.ptab.is-active');
        if(act) act.focus();
        return;
      }
    }

    var card = e.target.closest('.tc-card');
    if(card && (e.key === 'Enter' || e.key === ' ')){
      e.preventDefault();
      state.metric = Number(card.getAttribute('data-i'));
      syncMetricCards();
      renderTrend();
      return;
    }
    var grain = e.target.closest('[data-g]');
    if(grain && (e.key === 'Enter' || e.key === ' ')){
      e.preventDefault();
      setGrain(grain.getAttribute('data-g'));
    }
  }

  document.addEventListener('click', function(e){
    /* 面板重绘后点击目标已脱离文档，closest 找不到容器，用事件路径兜住 */
    var path = typeof e.composedPath === 'function' ? e.composedPath() : [];
    var inside = path.some(function(n){ return n && n.classList && n.classList.contains('dd-wrap'); });
    if(!inside && !e.target.closest('.dd-wrap')) closeDropdowns();
  });

  /* ------------------------------------------------------------------
     侧导航抽屉 / 窗口自适应
     ------------------------------------------------------------------ */
  function setNav(open){
    var sn = document.getElementById('sideNav');
    if(!sn) return;
    sn.classList.toggle('is-open', open);
    navBackdrop.hidden = !open;
    var btn = reportPage.querySelector('[data-nav-toggle]');
    if(btn){
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      btn.setAttribute('aria-label', open ? '关闭侧导航' : '打开侧导航');
    }
  }

  navBackdrop.addEventListener('click', function(){ setNav(false); });

  window.addEventListener('keydown', function(e){
    if(e.key !== 'Escape') return;
    var sn = document.getElementById('sideNav');
    if(sn && sn.classList.contains('is-open')){ setNav(false); return; }
    var openDate = reportPage.querySelector('.dd-wrap[data-dd="date"].is-open');
    closeDropdowns();
    if(openDate){
      var trig = openDate.querySelector('.u-dsel-tr');
      if(trig) trig.focus();
    }
  });

  var resizeTimer = null;
  window.addEventListener('resize', function(){
    var openDate = reportPage.querySelector('.dd-wrap[data-dd="date"].is-open');
    if(openDate) placeDatePanel(openDate);
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){
      if(isFbPage()) renderFbCharts();
      else if(state.view === 'chart') renderTrend();
    }, 140);
  });

  /* ------------------------------------------------------------------
     初始化
     ------------------------------------------------------------------ */
  window.DSShell = { scene:SCENE, mode:MODE, brand:BRAND, toast:toast };
  document.title = '页面模板 · ' + BRAND;
  mountPage();
})();
</script>
